branchName: '${issue.number}'
branches:
  - label: '✨ Feature'
    prefix: 'feature/'
  - label: '🐞 Fix'
    prefix: 'fix/'
  - label: '♻️ Refactor'
    prefix: 'refactor/'
  - label: '🌏 Deploy'
    prefix: 'deploy/'
  - label: '📃 Docs'
    prefix: 'docs/'
  - label: '🔧 Chore'
    prefix: 'chore/'
  - label: '🧪 Test'
    prefix: 'test/'
commentMessage: 'Branch ${branchName} created!'
autoCloseIssue: true
