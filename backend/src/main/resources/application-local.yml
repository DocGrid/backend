spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:app}?currentSchema=${DB_SCHEMA:public}&sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: docgrid-local-db-pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    # 반복 Worker 조회 SQL은 기본적으로 숨기고 필요할 때만 환경 변수로 진단 출력을 켠다.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
