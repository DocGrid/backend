spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: docgrid
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    # 전역 OSIV를 끄고, WebMvcConfig에서 /mcp를 제외한 나머지 경로에만 다시 등록한다.
    # /mcp는 MCP Streamable HTTP 응답 처리 방식과 OSIV가 충돌해 DB 커넥션이 누수됐다(#120).
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    mcp:
      server:
        name: docgrid-mcp-server
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true
  task:
    scheduling:
      pool:
        # DB Claim 지연이 Worker Heartbeat·Lease 복구 실행을 막지 않도록, Dashboard debounce push까지
        # 포함해 네 작업을 분리한다.
        size: 4

dashboard:
  push:
    # 짧은 시간에 몰리는 Job 상태 전이 이벤트를 이 주기로 모아서 한 번만 집계·push한다(debounce).
    debounce-interval-ms: ${DASHBOARD_PUSH_DEBOUNCE_INTERVAL_MS:300}

document:
  upload:
    max-file-size: 10MB
  chunking:
    chunk-size: ${DOCUMENT_CHUNK_SIZE:1000}
    overlap: ${DOCUMENT_CHUNK_OVERLAP:200}

indexing:
  worker:
    enabled: ${INDEXING_WORKER_ENABLED:false}
    name: ${INDEXING_WORKER_NAME:indexing-worker}
    heartbeat-interval: ${INDEXING_WORKER_HEARTBEAT_INTERVAL:10s}
    dead-threshold: ${INDEXING_WORKER_DEAD_THRESHOLD:30s}
    polling-interval: ${INDEXING_WORKER_POLLING_INTERVAL:1s}
    max-concurrency: ${INDEXING_WORKER_MAX_CONCURRENCY:2}
    lease-duration: ${INDEXING_WORKER_LEASE_DURATION:5m}
    lease-renewal-interval: ${INDEXING_WORKER_LEASE_RENEWAL_INTERVAL:1m}
    lease-recovery-interval: ${INDEXING_WORKER_LEASE_RECOVERY_INTERVAL:30s}
    lease-recovery-batch-size: ${INDEXING_WORKER_LEASE_RECOVERY_BATCH_SIZE:100}
    # Retry 지연은 10초부터 지수 증가하며 운영 기본 상한인 5분에서 제한한다.
    retry-initial-delay: ${INDEXING_WORKER_RETRY_INITIAL_DELAY:10s}
    retry-max-delay: ${INDEXING_WORKER_RETRY_MAX_DELAY:5m}
    shutdown-grace-period: ${INDEXING_WORKER_SHUTDOWN_GRACE_PERIOD:30s}

sync:
  dispatcher:
    enabled: ${SYNC_DISPATCHER_ENABLED:false}
    name: ${SYNC_DISPATCHER_NAME:sync-dispatcher}
    polling-interval: ${SYNC_DISPATCHER_POLLING_INTERVAL:1s}
    lease-duration: ${SYNC_DISPATCHER_LEASE_DURATION:30s}
    lease-recovery-interval: ${SYNC_DISPATCHER_LEASE_RECOVERY_INTERVAL:10s}
    lease-recovery-batch-size: ${SYNC_DISPATCHER_LEASE_RECOVERY_BATCH_SIZE:100}
    retry-initial-delay: ${SYNC_DISPATCHER_RETRY_INITIAL_DELAY:5s}
    retry-max-delay: ${SYNC_DISPATCHER_RETRY_MAX_DELAY:1m}
  reconciliation:
    enabled: ${SYNC_RECONCILIATION_ENABLED:false}
    mode: ${SYNC_RECONCILIATION_MODE:DRY_RUN}
    batch-size: ${SYNC_RECONCILIATION_BATCH_SIZE:100}
    interval: ${SYNC_RECONCILIATION_INTERVAL:5m}
    stalled-threshold: ${SYNC_RECONCILIATION_STALLED_THRESHOLD:15m}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600}

embedding:
  server:
    base-url: ${EMBEDDING_SERVER_URL:http://localhost:8000}
    connect-timeout: ${EMBEDDING_SERVER_CONNECT_TIMEOUT:5s}
    read-timeout: ${EMBEDDING_SERVER_READ_TIMEOUT:5s}
  document:
    # 실제 BGE-M3 CPU Benchmark에서 최고 처리량의 98.3%를 유지하면서 Batch 64보다 p95가 47% 낮은 균형점이다.
    batch-size: ${EMBEDDING_DOCUMENT_BATCH_SIZE:32}

ollama:
  server:
    base-url: ${OLLAMA_SERVER_URL:http://localhost:11434}
    # Sites Worker의 30초 요청 제한보다 먼저 종료해 검색 결과 Fallback을 반환한다.
    connect-timeout: ${OLLAMA_SERVER_CONNECT_TIMEOUT:5s}
    read-timeout: ${OLLAMA_SERVER_READ_TIMEOUT:20s}
  model: ${OLLAMA_MODEL:qwen2.5:7b}
