services:
  postgres:
    build:
      context: ./docker/opensql
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: local-opensql
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_password}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - opensql_data:/var/lib/pgsql
      - ./docker/opensql/vars.yml:/tmp/settings/vars/vars.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "/usr/pgsql-14/bin/pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - docgrid-local

  minio:
    image: minio/minio
    container_name: docgrid-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin1234
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docgrid-local

  embedding-server:
    build:
      context: ./embedding-server
      dockerfile: Dockerfile
    container_name: docgrid-embedding
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    networks:
      - docgrid-local

  ollama:
    image: ollama/ollama
    container_name: docgrid-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - docgrid-local

networks:
  docgrid-local:

volumes:
  opensql_data:
    name: opensql_data
  minio-data:
  huggingface-cache:
  ollama-data:
