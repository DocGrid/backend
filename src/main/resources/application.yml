spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: docgrid
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

document:
  upload:
    max-file-size: 10MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600}
